name: kUSD v2 tests

on:
  push:
    branches: [main]
    paths: ["contracts/v2/**", ".github/workflows/v2-tests.yml"]
  pull_request:
    paths: ["contracts/v2/**", ".github/workflows/v2-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts/v2/harness
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc (kaspa-grpc-client build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/v2/harness
      - name: Covenant test suite (compiles every .ag, runs them in the node's script engine)
        run: cargo test --release --locked
