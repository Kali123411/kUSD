[package]
name = "kusd-v2-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Research harness for the kUSD v2 (Argent / SilverScript 1.0 / KCC-20-shaped) port.
# argent-lang/argent pinned by git rev (also recorded in contracts/v2/README.md),
# so a fresh clone builds and runs the suite with no sibling checkout.

[dependencies]
argent = { git = "https://github.com/argent-lang/argent", rev = "0cf5b30b3e9c443bea378cab9175c3638092ef94" }
argent-runtime = { git = "https://github.com/argent-lang/argent", rev = "0cf5b30b3e9c443bea378cab9175c3638092ef94" }
kaspa-consensus-core = "2.1.0"
kaspa-txscript = "2.1.0"
kaspa-txscript-errors = "2.1.0"
secp256k1 = { version = "0.29.0", features = ["global-context"] }
blake3 = "1.8.5"
blake2b_simd = "1"
kaspa-addresses = "2.1.0"
kaspa-grpc-client = "2.1.0"
kaspa-rpc-core = "2.1.0"
kaspa-notify = "2.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

[workspace]
